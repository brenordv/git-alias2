[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "git-alias2"
version = "2.2.0"
description = "Git aliases for multi-provider repository management"
requires-python = ">=3.11"
dependencies = [
    "GitPython==3.2.1",
    "raccoon-simple-stopwatch==0.0.3",
    "simple-log-factory==2.0.0",
]

[project.scripts]
g = "g:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "mypy==2.4.1",
    "ruff==0.17.3",
]

[tool.setuptools]
py-modules = ["g"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true

# raccoon-simple-stopwatch ships without a py.typed marker.
[[tool.mypy.overrides]]
module = ["raccoon_simple_stopwatch.*"]
ignore_missing_imports = true
